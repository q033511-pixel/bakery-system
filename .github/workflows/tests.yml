name: tests

# بوابة الجودة الموحدة: typecheck + lint + اختبارات + بناء على كل PR وpush
# + اختبارات الخادم الحقيقية مقابل PostgreSQL 17 (نفس محرك Supabase السحابي)
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (اختبارات الخادم تُتخطى هنا — بلا قاعدة)
        run: npm test
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bakery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bakery_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: تطبيق الحاضنة المحلية + جميع الـmigrations على قاعدة نظيفة
        run: APPLY_SHIM=1 node scripts/apply-migrations.js
      - name: اختبارات الخادم الحقيقية (SQL + RLS + أجهزة + مزامنة + 10 سيناريوهات)
        run: npx vitest run
